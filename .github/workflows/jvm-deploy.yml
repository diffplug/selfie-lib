# Run this from the `release` branch. It reads these secrets from the `maven-central` environment:
# NEXUS_USER
# NEXUS_PASS
# GPG_PASSPHRASE
# GPG_KEY
#   gpg --export-secret-subkeys --armor SUBKEY_ID! | pbcopy
#   subkeys only, so the primary key never lands in CI
#
# Store each secret in the exact form the build consumes. GitHub masks the value it was given, so
# anything a workflow step decodes or reshapes is no longer masked and lands in the log. Never use
# base64 variants: https://github.com/diffplug/spotless/issues/3089

on:
  workflow_dispatch:
    inputs:
      to_publish:
        description: 'What to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
defaults:
  run:
    working-directory: jvm
jobs:
  build:
    runs-on: ubuntu-latest
    name: deploy
    # holds the publishing secrets, restricted to `release` with a required reviewer
    environment: maven-central
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ORG_GRADLE_PROJECT_nexus_user: ${{ secrets.NEXUS_USER }}
      ORG_GRADLE_PROJECT_nexus_pass: ${{ secrets.NEXUS_PASS }}
      ORG_GRADLE_PROJECT_gpg_key: ${{ secrets.GPG_KEY }}
      # Gradle requires the last 8 hex digits of signing subkey FA5C18CFB74EC7C6.
      ORG_GRADLE_PROJECT_gpg_key_id: "0xB74EC7C6"
      ORG_GRADLE_PROJECT_gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: gradle caching
        uses: gradle/actions/setup-gradle@v4
      - name: git fetch origin main
        run: git fetch origin main
      - name: publish all
        if: "${{ github.event.inputs.to_publish == 'all' }}"
        run: |
          ./gradlew :changelogPush -Prelease=true -Penable_publishing=true --stacktrace --warning-mode all --no-configuration-cache --no-scan
