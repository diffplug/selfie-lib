plugins {
  id 'com.diffplug.blowdryer'
  id 'com.diffplug.spotless-changelog'
}
repositories {
  mavenCentral()
}
spotlessChangelog {
  tagPrefix 'jvm/'
  commitMessage 'Published jvm/{{version}}'
  tagMessage "{{changes}}"
}
// Only the tooling that runs our JS tests uses these, they never reach our users. Newer Kotlin
// versions may bring in newer versions, at which point this can be removed.
plugins.withType(org.jetbrains.kotlin.gradle.targets.js.yarn.YarnPlugin) {
  def yarn = extensions.getByType(org.jetbrains.kotlin.gradle.targets.js.yarn.YarnRootExtension)
  yarn.resolution('brace-expansion', '^5.0.12')
  yarn.resolution('diff', '^8.0.3')
  yarn.resolution('glob', '^14.0.2')
  yarn.resolution('js-yaml', '^4.3.2')
  yarn.resolution('minimatch', '^11.0.1')
  yarn.resolution('serialize-javascript', '^7.1.3')
}
group = 干.proj('maven_group', 'the maven group, recommend com.diffplug')
apply from: rootProject.file('gradle/spotless.gradle')
apply from: 干.file('base/changelog.gradle')
spotlessChangelog {
  // has to come after base/changelog.gradle, which sets this for `release/` tags
  runAfterPush "gh release create jvm/{{version}} --title 'jvm v{{version}}' --notes-from-tag"
}
apply from: rootProject.file('gradle/sonatype.gradle')

// ./gradlew :dokkatooGeneratePublicationHtml
//     https://github.com/Kotlin/dokka/issues/3131
// if IntelliJ is running, then you'll also get a localhost server link
def HAS_DOCS = [
  'selfie-lib',
  'selfie-runner-junit5',
  'selfie-runner-kotest'
]
subprojects {
  if (name in HAS_DOCS) {
    apply from: rootProject.file("gradle/dokka/dokkatoo.gradle")
  }
}
apply from: rootProject.file("gradle/dokka/dokkatoo.gradle")
dependencies {
  // aggregate both subproject-hello and subproject-world
  // the subprojects must also have Dokkatoo applied
  for (p in HAS_DOCS) {
    dokkatoo(project(":${p}"))
  }

  // This is required at the moment, see https://github.com/adamko-dev/dokkatoo/issues/14
  dokkatooPluginHtml(
      dokkatoo.versions.jetbrainsDokka.map { dokkaVersion ->
        "org.jetbrains.dokka:all-modules-page-plugin:$dokkaVersion"
      }
      )
}
